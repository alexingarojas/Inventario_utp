<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Almacenes</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-6">
            <h2><i class="bi bi-building"></i> Almacenes</h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="/almacenes/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nuevo Almacén
            </a>
        </div>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensaje}" th:class="'alert alert-' + ${tipo} + ' alert-dismissible fade show'" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de almacenes -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th>Ciudad</th>
                    <th>Fecha Registro</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="almacen : ${almacenes}">
                    <td th:text="${almacen.id}"></td>
                    <td th:text="${almacen.codigo}"></td>
                    <td th:text="${almacen.nombre}"></td>
                    <td th:text="${almacen.direccion}"></td>
                    <td th:text="${almacen.ciudad}"></td>
                    <td th:text="${#temporals.format(almacen.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/stock/almacen/{id}(id=${almacen.id})}" class="btn btn-sm btn-info" title="Ver Stock">
                            <i class="bi bi-box-seam"></i>
                        </a>
                        <a href="#" class="btn btn-sm btn-warning" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <a href="#" class="btn btn-sm btn-danger" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no hay almacenes -->
    <div th:if="${#lists.isEmpty(almacenes)}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> No hay almacenes registrados. 
        <a href="/almacenes/nuevo">Crear el primer almacén</a>
    </div>

</div>
</body>
</html>
