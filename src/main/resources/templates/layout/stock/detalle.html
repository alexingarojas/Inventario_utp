<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Detalle de Stock</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2>
                <i class="bi bi-box-seam"></i> Detalle de Stock
            </h2>
        </div>
        <div class="col-md-4 text-end">
            <a href="/stock" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

    <!-- Tabla de stocks -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Código</th>
                    <th>Almacén</th>
                    <th>Cantidad Total</th>
                    <th>Cantidad Reservada</th>
                    <th>Cantidad Disponible</th>
                    <th>Última Actualización</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stock : ${stocks}">
                    <td th:text="${stock.id}"></td>
                    <td th:text="${stock.productoNombre}"></td>
                    <td th:text="${stock.productoCodigo}"></td>
                    <td th:text="${stock.almacenNombre}"></td>
                    <td>
                        <span class="badge bg-info" th:text="${stock.cantidad}"></span>
                    </td>
                    <td>
                        <span class="badge bg-warning" th:text="${stock.cantidadReservada}"></span>
                    </td>
                    <td>
                        <span th:class="'badge ' + (${stock.cantidadDisponible > 0} ? 'bg-success' : 'bg-danger')"
                              th:text="${stock.cantidadDisponible}"></span>
                    </td>
                    <td th:text="${#temporals.format(stock.ultimaActualizacion, 'dd/MM/yyyy HH:mm')}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no hay stock -->
    <div th:if="${#lists.isEmpty(stocks)}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> No hay registros de stock.
    </div>

</div>
</body>
</html>
