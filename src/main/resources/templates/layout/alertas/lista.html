<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Alertas</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-6">
            <h2><i class="bi bi-exclamation-triangle"></i> Alertas de Stock Bajo</h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="/stock/nuevo" class="btn btn-warning">
                <i class="bi bi-arrow-repeat"></i> Actualizar Stock
            </a>
        </div>
    </div>

    <!-- Tabla de alertas -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Código</th>
                    <th>Almacén</th>
                    <th>Cantidad Total</th>
                    <th>Cantidad Reservada</th>
                    <th>Cantidad Disponible</th>
                    <th>Stock Minimo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="alerta : ${alertas}" class="table-danger">
                    <td th:text="${alerta.id}"></td>
                    <td th:text="${alerta.productoNombre}"></td>
                    <td th:text="${alerta.productoCodigo}"></td>
                    <td th:text="${alerta.almacenNombre}"></td>
                    <td>
                        <span class="badge bg-info" th:text="${alerta.cantidad}"></span>
                    </td>
                    <td>
                        <span class="badge bg-warning" th:text="${alerta.cantidadReservada}"></span>
                    </td>
                    <td>
                        <span class="badge bg-danger" th:text="${alerta.cantidadDisponible}"></span>
                    </td>
                    <td>
                        <span  th:text="${alerta.productoStockMinimo}"></span>
                    </td>
                    <td>
                        <a href="/stock/nuevo" class="btn btn-sm btn-success">
                            <i class="bi bi-plus-circle"></i> Reponer
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no hay alertas -->
    <div th:if="${#lists.isEmpty(alertas)}" class="alert alert-success">
        <i class="bi bi-check-circle"></i> ¡Excelente! No hay productos con stock bajo.
    </div>

</div>
</body>
</html>
