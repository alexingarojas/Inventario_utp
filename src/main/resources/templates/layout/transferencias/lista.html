<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Transferencias</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-6">
            <h2><i class="bi bi-arrow-left-right"></i> Transferencias</h2>
        </div>
        <div class="col-md-6 text-end">
            <a href="/transferencias/nuevo" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nueva Transferencia
            </a>
        </div>
    </div>

    <!-- Mensajes -->
    <div th:if="${mensaje}" th:class="'alert alert-' + ${tipo} + ' alert-dismissible fade show'" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabla de productos -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Producto</th>
                    <th>Código</th>
                    <th>Precio</th>
                    <th>Stock Mínimo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.codigo}"></td>
                    <td th:text="'$' + ${#numbers.formatDecimal(producto.precio, 1, 2)}"></td>
                    <td th:text="${producto.stockMinimo}"></td>
                    <td>
                        <a th:href="@{/transferencias/ver/{id}(id=${producto.id})}" class="btn btn-sm btn-info" title="Ver stock en almacenes">
                            <i class="bi bi-eye"></i> Ver Stock
                        </a>
                        <a th:href="@{/transferencias/nuevo(productoId=${producto.id})}" class="btn btn-sm btn-warning">
                            <i class="bi bi-arrow-left-right"></i> Transferir
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no hay productos -->
    <div th:if="${#lists.isEmpty(productos)}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> No hay productos disponibles.
    </div>

</div>
</body>
</html>
