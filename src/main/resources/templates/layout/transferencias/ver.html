<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Stock del Producto</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-8">
            <h2>
                <i class="bi bi-box-seam"></i> Stock - <span th:text="${productoNombre}"></span>
            </h2>
            <p class="text-muted" th:text="'Código: ' + ${productoCodigo}"></p>
        </div>
        <div class="col-md-4 text-end">
            <a th:href="@{/transferencias/nuevo(productoId=${productoId})}" class="btn btn-warning">
                <i class="bi bi-arrow-left-right"></i> Transferir este Producto
            </a>
        </div>
    </div>

    <!-- Info -->
    <div class="alert alert-info">
        <i class="bi bi-info-circle"></i> Selecciona un almacén origen para realizar una transferencia.
    </div>

    <!-- Tabla de stocks por almacén -->
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Almacén (Origen)</th>
                    <th>Código</th>
                    <th>Cantidad Total</th>
                    <th>Cantidad Reservada</th>
                    <th>Cantidad Disponible</th>
                    <th>Estado</th>
                    <th>Última Actualización</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stock : ${stocks}">
                    <td th:text="${stock.almacenNombre}"></td>
                    <td th:text="${stock.almacenCodigo}"></td>
                    <td>
                        <span class="badge bg-info" th:text="${stock.cantidad}"></span>
                    </td>
                    <td>
                        <span class="badge bg-warning" th:text="${stock.cantidadReservada}"></span>
                    </td>
                    <td>
                        <span th:class="'badge ' + (${stock.cantidadDisponible > 0} ? 'bg-success' : 'bg-danger')"
                              th:text="${stock.cantidadDisponible}"></span>
                    </td>
                    <td>
                        <span th:if="${stock.cantidadDisponible > 0}" class="badge bg-success">Disponible</span>
                        <span th:if="${stock.cantidadDisponible == 0}" class="badge bg-danger">Agotado</span>
                    </td>
                    <td th:text="${#temporals.format(stock.ultimaActualizacion, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/transferencias/nuevo(productoId=${productoId},origenId=${stock.almacenId})}" 
                           class="btn btn-sm btn-primary" 
                           th:disabled="${stock.cantidadDisponible == 0}">
                            <i class="bi bi-arrow-right"></i> Transferir
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no hay stock -->
    <div th:if="${#lists.isEmpty(stocks)}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> No hay registros de stock para este producto.
    </div>

    <div class="row mt-4">
        <div class="col-md-12">
            <a href="/transferencias" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Volver
            </a>
        </div>
    </div>

</div>
</body>
</html>
