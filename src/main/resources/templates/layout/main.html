<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        @keyframes vibrar {
            0% { transform: rotate(0); }
            15% { transform: rotate(15deg); }
            30% { transform: rotate(-15deg); }
            45% { transform: rotate(10deg); }
            60% { transform: rotate(-10deg); }
            75% { transform: rotate(5deg); }
            85% { transform: rotate(-5deg); }
            100% { transform: rotate(0); }
        }

        .campana-vibrando {
            animation: vibrar 0.6s ease-in-out infinite;
            display: inline-block;
        }

        .contenedor-campana {
            position: relative;
            display: inline-block;
            cursor: pointer;
        }

        /* Badge circular para el contador numérico de alertas */
        .badge-contador {
            position: absolute;
            top: -2px;
            right: -8px;
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 50%;
            border: 2px solid #212529;
        }

        .dropdown-menu-alertas {
            width: 320px;
            max-height: 450px;
            overflow-y: auto;
        }

        .alerta-item {
            font-size: 0.85rem;
            white-space: normal;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
    <a class="navbar-brand" th:href="@{/}">📦 Inventario</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Productos</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/almacenes}">Almacenes</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/stock}">Stock</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/reservas}">Reservas</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/transferencias}">Transferencias</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/alertas}">Alertas</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/reportes}">Reportes</a></li>
        </ul>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle no-caret contenedor-campana" href="#" id="navbarDropdownAlertas" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i id="icono-campana"
                       class="bi bi-bell-fill fs-4"
                       th:classappend="${totalAlertas > 0} ? 'text-danger campana-vibrando' : 'text-success'">
                    </i>
                    <span id="contador-campana"
                          class="badge badge-contador"
                          th:classappend="${totalAlertas > 0} ? 'bg-danger' : 'd-none'"
                          th:text="${totalAlertas}">0</span>
                </a>

                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-alertas p-2 shadow-lg" aria-labelledby="navbarDropdownAlertas" id="lista-alertas">
                    <li id="sin-alertas-mensaje" th:if="${totalAlertas == 0}">
                        <h6 class="dropdown-header text-center py-3 text-muted">No tienes alertas pendientes</h6>
                    </li>

                    <li id="divisor-alertas" th:if="${totalAlertas > 0}"><hr class="dropdown-divider"></li>

                    <li class="text-center p-1">
                        <a href="/alertas" class="btn btn-sm btn-outline-danger w-100"><i class="bi bi-eye-fill"></i> Ver Alertas</a>
                    </li>
                </ul>
            </li>
        </ul>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div layout:fragment="content">
        <!-- contenido de cada página va aquí -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const socket = new SockJS('http://localhost:8080/ws-inventario');
    const stompClient = Stomp.over(socket);

    stompClient.debug = null;

    stompClient.connect({}, function (frame) {
        console.log('WebSocket conectado globalmente.');

        stompClient.subscribe('/topic/alertas', function (mensajePayload) {
            try {
                const alerta = JSON.parse(mensajePayload.body);

                agregarAlertaALista(alerta);

                const contadorHome = document.getElementById('contador-alertas');
                if (contadorHome) {
                    let valor = parseInt(contadorHome.innerText) || 0;
                    contadorHome.innerText = valor + 1;
                }
            } catch (e) {
                console.error("Error al procesar la alerta:", e);
            }
        });
    }, function (error) {
        console.error('Error de conexión WebSocket:', error);
    });


    function agregarAlertaALista(alerta) {
        const lista = document.getElementById('lista-alertas');
        const sinAlertasMsg = document.getElementById('sin-alertas-mensaje');

        if (sinAlertasMsg) {
            sinAlertasMsg.remove();
        }

        const nuevaAlertaLi = document.createElement('li');
        nuevaAlertaLi.innerHTML = `
            <div class="alert alert-danger mx-2 mb-2 p-2 alerta-item shadow-sm">
                <strong>⚠️ STOCK BAJO:</strong> ${alerta.productoNombre}<br>
                <small class="text-muted">Almacén: ${alerta.almacenNombre}</small><br>
                <div class="d-flex justify-content-between mt-1">
                    <span class="badge bg-dark">Disp: ${alerta.disponible}</span>
                    <span class="badge bg-secondary">Min: ${alerta.minimo}</span>
                </div>
            </div>
        `;

        lista.insertBefore(nuevaAlertaLi, lista.firstChild);
    }

    document.getElementById('navbarDropdownAlertas').addEventListener('click', function() {
        const campana = document.getElementById('icono-campana');
        if (campana && campana.classList.contains('campana-vibrando')) {
            campana.classList.remove('campana-vibrando');
        }
    });
</script>
</body>
</html>
