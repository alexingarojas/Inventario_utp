<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Reportes</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row mb-4">
        <div class="col-md-6">
            <h2><i class="bi bi-graph-up"></i> Reportes de Movimientos</h2>
        </div>
    </div>

    <!-- Filtros -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-funnel"></i> Filtros</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/reportes}" method="get" class="row g-3">
                <!-- Rango de fechas -->
                <div class="col-md-2">
                    <label for="desde" class="form-label">Desde</label>
                    <input type="date" class="form-control" id="desde" name="desde"
                           th:value="${desde}">
                </div>
                <div class="col-md-2">
                    <label for="hasta" class="form-label">Hasta</label>
                    <input type="date" class="form-control" id="hasta" name="hasta"
                           th:value="${hasta}">
                </div>
                <!-- Filtro por producto -->
                <div class="col-md-3">
                    <label for="productoId" class="form-label">Producto</label>
                    <select class="form-select" id="productoId" name="productoId">
                        <option value="">-- Todos los productos --</option>
                        <option th:each="p : ${productos}"
                                th:value="${p.id}"
                                th:text="${p.nombre} + ' (' + ${p.codigo} + ')'"
                                th:selected="${p.id == productoId}"></option>
                    </select>
                </div>
                <!-- Filtro por tipo de movimiento -->
                <div class="col-md-2">
                    <label for="tipoMovimiento" class="form-label">Tipo</label>
                    <select class="form-select" id="tipoMovimiento" name="tipoMovimiento">
                        <option value="">-- Todos --</option>
                        <option th:each="tipo : ${tiposMovimiento}"
                                th:value="${tipo.name()}"
                                th:text="${tipo.name()}"
                                th:selected="${tipo.name() == tipoMovimiento}"></option>
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-search"></i> Filtrar
                    </button>
                    <a href="/reportes" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle"></i> Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Resumen de resultados -->
    <div class="alert alert-info d-flex align-items-center mb-3" th:if="${totalMovimientos != null}">
        <i class="bi bi-info-circle me-2"></i>
        <span>Se encontraron <strong th:text="${totalMovimientos}"></strong> movimiento(s)
              del <strong th:text="${#temporals.format(desde, 'dd/MM/yyyy')}"></strong>
              al <strong th:text="${#temporals.format(hasta, 'dd/MM/yyyy')}"></strong>
        </span>
    </div>

    <!-- Tabla de movimientos -->
    <div class="table-responsive" th:if="${!#lists.isEmpty(movimientos)}">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Producto</th>
                    <th>Código</th>
                    <th>Almacén Origen</th>
                    <th>Almacén Destino</th>
                    <th>Cantidad</th>
                    <th>Referencia</th>
                    <th>Notas</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="mov : ${movimientos}">
                    <td th:text="${#temporals.format(mov.fechaMovimiento, 'dd/MM/yyyy')}"></td>
                    <td>
                        <span th:class="${'badge bg-' + (mov.tipoMovimiento.name() == 'ENTRADA' ? 'success' : mov.tipoMovimiento.name() == 'SALIDA' ? 'danger' : mov.tipoMovimiento.name() == 'TRANSFERENCIA' ? 'info' : mov.tipoMovimiento.name() == 'RESERVA' ? 'warning' : 'secondary')}"
                              th:text="${mov.tipoMovimiento.name()}"></span>
                    </td>
                    <td th:text="${mov.productoNombre}"></td>
                    <td th:text="${mov.productoCodigo}"></td>
                    <td th:text="${mov.almacenOrigenCodigo}"></td>
                    <td th:text="${mov.almacenDestinoCodigo}"></td>
                    <td><strong th:text="${mov.cantidad}"></strong></td>
                    <td th:text="${mov.referencia}"></td>
                    <td th:text="${mov.notas}"></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Mensaje si no hay movimientos -->
    <div th:if="${#lists.isEmpty(movimientos)}" class="alert alert-warning">
        <i class="bi bi-exclamation-triangle"></i> No hay movimientos para los filtros seleccionados.
    </div>

</div>
</body>
</html>
